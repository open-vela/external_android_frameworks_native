[package]
name = "android-binder"
version = "0.1.0"
edition = "2021"
description = "Safe bindings to Android Binder, restricted to the NDK"
license = "Apache-2.0"


[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 'z'

[dependencies]
binder-ndk-sys = { package = "android-binder-ndk-sys", version = "0.1", path = "./sys" }
downcast-rs = "1.2.1"
libc = "0.2.159"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(android_vendor)", "cfg(android_ndk)", "cfg(android_vndk)", "cfg(trusty)", "cfg(vendor_ndk)"]

